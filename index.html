<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CattleCare AI — 스마트 우사 관리</title>
<style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;background:#0b1722;color:#e7f0f5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#122536;border-bottom:1px solid #365267;padding:18px 4%;position:sticky;top:0;z-index:2}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:800;cursor:pointer}.logo span{color:#71dab7}nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}nav button,.subbtn{background:transparent;border:1px solid #345063;border-radius:8px;color:#bdceda;padding:8px 11px;font-size:12px}nav button.active,nav button:hover{background:#24524b;color:#b9ffe8}main{max-width:1450px;margin:auto;padding:26px 4% 90px}.hero{text-align:center;padding:66px 0 35px}.hero h1{font-size:clamp(28px,4vw,49px);margin:12px 0}.hero h1 em{color:#79e3be;font-style:normal}.muted{color:#91a8bb;line-height:1.6;font-size:13px}.search{display:flex;gap:8px;max-width:850px;margin:27px auto 16px;background:#1b3445;border:1px solid #416178;padding:9px;border-radius:16px}.search input{flex:1;min-width:0;border:0;background:transparent;color:#fff;padding:12px;outline:none}.button{background:#49c39b;color:#08271e;border:0;border-radius:9px;padding:11px 16px;font-weight:750}.button.secondary{background:#203b4f;color:#d5e5ef;border:1px solid #466276}.chips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.chips button{background:#142d40;border:1px solid #32526a;color:#c7d6e0;border-radius:20px;padding:10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#132838;border:1px solid #2e4658;border-radius:14px;padding:20px}.card{cursor:pointer}.card:hover{border-color:#72dbb9}.card h3{margin:0 0 12px}.big{font-size:29px;font-weight:800;color:#f1fffa;margin:9px 0}h2{margin:22px 0 16px}.layout{display:grid;grid-template-columns:1fr 1.6fr;gap:18px}.field{display:grid;gap:5px;margin:9px 0;font-size:12px;color:#9bb9c8}.field input,.field select{width:100%;background:#081b29;border:1px solid #365568;border-radius:8px;color:white;padding:11px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actionrow{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.panel{margin-bottom:18px;min-width:0}.panel h3{margin:0 0 15px}.result{border:1px solid #438b73;background:#164034;border-radius:9px;padding:15px;margin:14px 0;line-height:1.7;font-size:13px}.notice{background:#3e3326;color:#eed4a8;padding:13px;border-radius:9px;font-size:13px}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;border-bottom:1px solid #334f60;padding:11px;white-space:nowrap}th{color:#9dbacb}.chart{width:100%;height:225px}.badge{font-size:11px;background:#245147;padding:5px 8px;border-radius:7px;color:#a1f4d4}.report{white-space:pre-wrap;line-height:1.8}.foot{margin-top:35px;font-size:12px;color:#809daf}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:540px){.fields{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero{padding:32px 0}.search input{padding:5px}}@media print{header,button,.search,.field,.foot{display:none!important}:root{background:white;color:black}.panel,.card{background:white;color:black}.report,.muted{color:black}}

.history-area{margin:30px 0 0;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(245px,.75fr);gap:16px}
.history-section{background:#132838;border:1px solid #2e4658;border-radius:14px;padding:20px;min-width:0}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
.section-head h3{margin:0}.history-item{display:flex;align-items:center;gap:9px;padding:11px 0;border-top:1px solid #2c4658;min-width:0}
.history-item .info{flex:1;min-width:0}.history-item .info strong{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-item .info small{font-size:11px;color:#8ba7b8}
.history-item button,.mini-action{font-size:12px;border:1px solid #446277;border-radius:7px;background:#1c3b4e;color:#d5e7ef;padding:7px 10px}
.history-item input[type=checkbox]{accent-color:#49c39b;width:16px;height:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.empty-state{font-size:13px;color:#94acba;padding:18px 0}
@media(max-width:800px){.history-area{grid-template-columns:1fr}}
.top-actions{display:flex;align-items:center;gap:8px}.top-actions button{background:#1c3a4c;border:1px solid #456579;color:#dcecf2;border-radius:8px;padding:9px 11px;font-size:12px}.top-actions button:hover,.report-launch:hover{border-color:#7ee0be}.favorite-compact .history-item:nth-of-type(n+5){display:none}.report-launch{width:100%;text-align:left;border:1px solid #59b998;background:linear-gradient(105deg,#205a4e,#163c43);color:#e7fff4;border-radius:12px;padding:15px 16px;margin-top:15px;cursor:pointer}.report-launch strong{display:block;font-size:15px;margin-bottom:4px}.report-launch small{color:#c4e7da}.usage-overlay{position:fixed;inset:0;background:#07121bd9;z-index:10;display:grid;place-items:center;padding:18px}.usage-dialog{background:#162f42;border:1px solid #527388;border-radius:16px;padding:24px;width:min(580px,100%);max-height:85vh;overflow:auto}.usage-dialog h2{margin:0 0 14px}.usage-dialog ol{padding-left:22px;color:#d5e5ec;line-height:1.9}.usage-dialog li{margin-bottom:9px}.usage-dialog .actions{text-align:right}@media(max-width:600px){.top-actions{gap:3px}.top-actions button{padding:7px}.logo{font-size:18px}}
.report-actions{margin:18px 0 0;padding:18px 22px;background:#112e38;border:1px solid #3d6867;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:22px}.report-actions strong{display:block;font-size:16px;margin-bottom:5px}.report-actions .report-launch{width:auto;min-width:225px;text-align:center;margin:0;background:#48c69b;color:#082b21;border:1px solid #65e5b7;border-radius:10px;padding:14px 22px;font-size:15px;font-weight:800}.report-actions .report-launch:hover{background:#7ee5bf;border-color:#a1f5d8}.report-actions .report-launch span{margin-left:9px}@media(max-width:650px){.report-actions{flex-direction:column;align-items:stretch}.report-actions .report-launch{width:100%}}

</style></head><body><div id="root"></div>
<script>
const names=['종합 대시보드','개체관리','환경관리','급이·급수','건강·복지 관리','AI 분석','설비관리','작업명령','출하관리','탄소·메탄관리','방역·질병 이력'];
const today=()=>new Date().toLocaleDateString('sv-SE'),ago=n=>{let x=new Date();x.setDate(x.getDate()-n);return x.toLocaleDateString('sv-SE')};
const schema={
'개체관리':[['id','개체 ID'],['rfid','RFID 번호'],['breed','품종'],['date','측정일'],['weight','체중 (kg)']],
'환경관리':[['id','우사'],['date','측정일'],['temp','온도 (℃)'],['humidity','습도 (%)'],['fanCmd','팬 명령'],['fanActual','실제 작동 확인']],
'급이·급수':[['id','개체 ID'],['date','측정일'],['feed','사료 공급량 (kg)'],['leftover','사료 잔량 (kg)'],['water','물 사용량 (L)']],
'건강·복지 관리':[['id','개체 ID'],['date','측정일'],['rumination','반추시간 (분)'],['feeding','섭취행동 시간 (분)'],['activity','활동지수']],
'설비관리':[['id','설비 ID'],['date','측정일'],['command','명령'],['actual','실제 상태'],['barn','우사']],
'작업명령':[['id','작업 ID'],['date','날짜'],['target','점검 대상'],['task','작업 내용'],['status','상태']],
'출하관리':[['id','개체 ID'],['date','기준일'],['weight','현재 체중 (kg)'],['target','목표체중 (kg)'],['planned','출하 예정일']],
'탄소·메탄관리':[['id','개체 ID'],['date','측정일'],['methane','메탄 (g/일)'],['dmi','DMI (kg/일)'],['method','측정 방법']],
'방역·질병 이력':[['id','개체 ID'],['date','관찰일'],['symptom','관찰 증상'],['treatment','진료·처치'],['followup','후속 점검일']]
};
function generate(){let d={};Object.keys(schema).forEach(n=>d[n]=[]);for(let i=1;i<=20;i++){let id='C'+String(i).padStart(3,'0');for(let n=6;n>=0;n--){d['개체관리'].push({id,rfid:'RF-'+i,breed:'한우',date:ago(n),weight:Math.round(390+i*7-n*.8),demo:true});d['건강·복지 관리'].push({id,date:ago(n),rumination:i===3&&n===0?315:450+i%5*7+n%3*3,feeding:250+i%5*4,activity:60+i%8,demo:true});d['탄소·메탄관리'].push({id,date:ago(n),methane:165+i*4+n%4*5,dmi: +(8+i*.15).toFixed(2),method:'가상 시연',demo:true});d['급이·급수'].push({id,date:ago(n),feed:10+i%4,leftover:1.1,water:40+i%9,demo:true})}d['출하관리'].push({id,date:today(),weight:390+i*7,target:550,planned:ago(-30),demo:true})}for(let n=6;n>=0;n--)for(let id of ['A동','B동'])d['환경관리'].push({id,date:ago(n),temp:id==='A동'?26+n%4:24+n%3,humidity:59+n%9,fanCmd:'ON',fanActual:id==='A동'&&n===0?'미수신':'ON',demo:true});d['설비관리'].push({id:'FAN-A1',date:today(),command:'ON',actual:'미수신',barn:'A동',demo:true});d['작업명령'].push({id:'W001',date:today(),target:'A동 팬',task:'회전 상태 현장 확인',status:'승인대기',demo:true});d['방역·질병 이력'].push({id:'C003',date:today(),symptom:'반추시간 감소 확인 필요',treatment:'관찰 대기',followup:today(),demo:true});return d}
let profile=localStorage.getItem('cattlecare-active-profile')||'';
const scopedKey=(key)=>profile?'cattlecare-profile-'+encodeURIComponent(profile)+'-'+key:'cattlecare-'+key+'-v1';
let data;try{data=JSON.parse(localStorage.getItem(scopedKey('data')))||(!profile?JSON.parse(localStorage.getItem('cattlecare-v1')):null)||generate()}catch(e){data=generate()}
const persist=()=>localStorage.setItem(scopedKey('data'),JSON.stringify(data));persist();
let page='홈',query='',animal='C001',start=ago(6),end=today(),edit=-1;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>Number.isFinite(+v)?Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2}):'—';
const records=(name,id)=>data[name].filter(r=>(!id||r.id===id)&&(!r.date||(r.date>=start&&r.date<=end))).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const searchBox=()=>'<form class="search" id="ask"><input id="q" placeholder="예: 오늘 1번 개체 메탄 배출량 알려줘" value="'+esc(query)+'"><button class="button">⌕ 검색·실행</button></form>';
function cards(){const cards=[['등록 개체',new Set(data['개체관리'].map(x=>x.id)).size+' 두','개체관리'],['목걸이 모니터링',new Set(data['건강·복지 관리'].map(x=>x.id)).size+' 개체','건강·복지 관리'],['메탄 기록',data['탄소·메탄관리'].length+' 건','탄소·메탄관리'],['승인 대기',data['작업명령'].filter(x=>x.status==='승인대기').length+' 건','작업명령']];return '<div class="grid">'+cards.map(([a,b,c])=>'<div class="card" data-page="'+c+'"><div class="muted">'+a+'</div><div class="big">'+b+'</div><div class="muted">상세 보기 →</div></div>').join('')+'</div>'}
function home(){return '<div class="hero"><div class="muted" style="letter-spacing:3px;color:#006400">YOUR SMART CATTLE ASSISTANT</div><h1>우사 운영의 모든 정보를<br><em>한 번의 질문으로.</em></h1><p class="muted">개체 성장부터 환경 디지털트윈, 반추시간과 메탄 배출까지.<br>자연어로 검색하면 해당 관리 화면이 열립니다.</p>'+searchBox()+'<div class="chips">'+['오늘 1번 개체 메탄 배출량 알려줘','3번 소 반추시간 분석해 줘','A동 온도와 팬 상태 확인해 줘','이번 주 보고서 만들어 줘'].map(q=>'<button data-query="'+esc(q)+'">'+esc(q)+'</button>').join('')+'</div></div><h2>가상 우사 현황 <span class="badge">DEMO</span></h2>'+cards()+historyPanel()+'<h2>빠른 관리</h2><div class="grid">'+['환경관리','건강·복지 관리','AI 분석','보고서'].map(n=>'<div class="card" data-page="'+n+'"><h3>'+n+'</h3><span class="muted">관리화면 열기 →</span></div>').join('')+'</div>'}

let recentKey=scopedKey('recent'), favKey=scopedKey('favorites');
function loadSaved(key){try{let r=JSON.parse(localStorage.getItem(key));return Array.isArray(r)?r:[]}catch(e){return []}}
function addRecent(q,kind='검색'){if(!q)return;let history=loadSaved(recentKey);history.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),query:q,kind,at:new Date().toLocaleString('ko-KR')});localStorage.setItem(recentKey,JSON.stringify(history.slice(0,80)))}
function historyPanel(){let history=loadSaved(recentKey),favs=loadSaved(favKey);let rows=(items,mode)=>items.length?items.slice(0,8).map((x,i)=>'<div class="history-item"><input aria-label="항목 선택" type="checkbox" class="history-check" data-id="'+esc(x.id)+'" data-mode="'+mode+'"><div class="info"><strong>'+esc(x.query)+'</strong><small>'+esc(x.kind||'검색')+' · '+esc(x.at||'저장된 명령')+'</small></div><button type="button" data-rerun="'+esc(x.id)+'" data-mode="'+mode+'">다시 실행</button>'+(mode==='recent'?'<button title="즐겨찾기" type="button" data-fav="'+esc(x.id)+'">☆</button>':'<button title="즐겨찾기 해제" type="button" data-unfav="'+esc(x.id)+'">×</button>')+'</div>').join(''):'<div class="empty-state">'+(mode==='recent'?'아직 질문이나 작업 기록이 없습니다. 중앙 검색창에서 명령을 실행해 보세요.':'최근 질문의 ☆ 버튼을 눌러 자주 쓰는 명령을 저장할 수 있습니다.')+'</div>';return '<div class="history-area"><section class="history-section"><div class="section-head"><h3>◷ 최근 질문 · 작업 내역</h3><span class="muted">'+history.length+'건</span></div>'+rows(history,'recent')+'<div class="toolbar"><button type="button" class="mini-action" data-export="recent">선택 항목 다운로드</button><button type="button" class="mini-action" data-export-all="recent">전체 기록 CSV</button><button type="button" class="mini-action" data-remove-selected="recent">선택 삭제</button></div></section><section class="history-section favorite-compact"><div class="section-head"><h3>☆ 즐겨찾기 명령</h3><span class="muted">'+favs.length+'개</span></div>'+rows(favs,'favorite')+'<div class="toolbar"><button type="button" class="mini-action" data-export="favorite">선택 항목 다운로드</button><button type="button" class="mini-action" data-export-all="favorite">전체 목록 CSV</button><button type="button" class="mini-action" data-remove-selected="favorite">선택 해제</button></div></button></section></div><div class="report-actions"><div><strong>관리 보고서</strong><div class="muted">선택한 기간의 우사 운영 기록을 종합하고 PDF로 출력합니다.</div></div><button type="button" class="report-launch" data-open-report="true">▤ 보고서 출력하기 <span aria-hidden="true">→</span></button></div>'}
function downloadHistory(items,filename){if(!items.length){alert('다운로드할 기록을 선택해 주세요.');return}let rows=['유형,내용,시각',...items.map(x=>[x.kind||'검색',x.query,x.at||''].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))];let url=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
function historyInteraction(e){let target=e.target.closest('button');if(!target)return;if(target.dataset.openReport){page='보고서';query='';render();scrollTo(0,0);return;}let dataset=target.dataset;let selected=mode=>[...document.querySelectorAll('.history-check:checked')].filter(x=>x.dataset.mode===mode).map(x=>x.dataset.id);let list=mode=>loadSaved(mode==='recent'?recentKey:favKey);if(dataset.rerun){let x=list(dataset.mode).find(y=>y.id===dataset.rerun);if(x)parse(x.query);return}if(dataset.fav){let x=list('recent').find(y=>y.id===dataset.fav);if(x){let f=list('favorite');if(!f.some(y=>y.query===x.query)){f.unshift({...x,id:Date.now().toString(),kind:'즐겨찾기'});localStorage.setItem(favKey,JSON.stringify(f))}render()}return}if(dataset.unfav){localStorage.setItem(favKey,JSON.stringify(list('favorite').filter(x=>x.id!==dataset.unfav)));render();return}if(dataset.export||dataset.exportAll){let mode=dataset.export||dataset.exportAll,items=list(mode);if(dataset.export)items=items.filter(x=>selected(mode).includes(x.id));downloadHistory(items,'CattleCare_'+(mode==='recent'?'최근작업':'즐겨찾기')+'.csv');return}if(dataset.removeSelected){let mode=dataset.removeSelected,ids=selected(mode);if(!ids.length){alert('삭제할 항목을 선택해 주세요.');return}localStorage.setItem(mode==='recent'?recentKey:favKey,JSON.stringify(list(mode).filter(x=>!ids.includes(x.id))));render()}}
document.addEventListener('click',historyInteraction);
function graph(recs,key){const v=recs.map(x=>+x[key]).filter(Number.isFinite);if(v.length<2)return '<p class="muted">그래프에 필요한 측정 기록이 부족합니다.</p>';const vals=v.slice(-25),mn=Math.min(...vals),mx=Math.max(...vals),span=mx-mn||1,points=vals.map((x,i)=>(35+i*660/(vals.length-1))+','+(190-(x-mn)/span*140)).join(' ');return '<svg class="chart" viewBox="0 0 730 235" aria-label="기록 변화 그래프"><g stroke="#3b596a">'+[50,85,120,155,190].map(y=>'<line x1="35" x2="700" y1="'+y+'" y2="'+y+'"/>').join('')+'</g><polyline fill="none" stroke="#006400" stroke-width="3" points="'+points+'"/><text x="6" y="48" fill="#a8c3d4" font-size="12">'+fmt(mx)+'</text><text x="6" y="192" fill="#a8c3d4" font-size="12">'+fmt(mn)+'</text></svg>'}
function summary(name,r){if(!r.length)return '조회 기간에 데이터가 없습니다.';let l=r.at(-1),s='최근 기록 '+(l.date||'')+': ';if(name==='탄소·메탄관리')s+=fmt(l.methane)+' g CH₄/일'+(+l.dmi>0?' · DMI 대비 '+fmt(l.methane/l.dmi)+' g/kg DMI':'')+'. 측정 방법: '+(l.method||'미기록');else if(name==='건강·복지 관리'){let b=r.slice(0,-1).reduce((x,y)=>x+(+y.rumination||0),0)/Math.max(1,r.length-1);s+=fmt(l.rumination)+' 분/일'+(r.length>1?' · 과거 평균 '+fmt(b)+' 분 · 변화율 '+fmt((l.rumination-b)/b*100)+'%':'')+'. 변화 감지는 건강 점검 후보일 뿐 질병 확진이 아닙니다.'}else if(name==='개체관리'){let days=Math.round((new Date(l.date)-new Date(r[0].date))/86400000);s+=fmt(l.weight)+' kg'+(days>0?' · ADG '+fmt((l.weight-r[0].weight)/days)+' kg/일':'')}else if(name==='환경관리'){let t=+l.temp,h=+l.humidity,thi=(1.8*t+32)-(0.55-0.0055*h)*(1.8*t-26);s+=fmt(t)+'℃ / '+fmt(h)+'% · THI '+fmt(thi)+' · 팬 명령 '+l.fanCmd+' / 실제 '+l.fanActual}else if(name==='급이·급수')s+='사료 공급 '+fmt(l.feed)+' kg / 잔량 '+fmt(l.leftover)+' kg / 물 사용량 '+fmt(l.water)+' L. 실제 섭취량은 별도 확인 필요.';else s+=JSON.stringify(l);return esc(s)}
function field(key,label){let isDate=/date|planned|followup/.test(key),isNum=/weight|rumination|feeding|activity|methane|dmi|temp|humidity|feed|leftover|water|target/.test(key);return '<label class="field">'+label+'<input name="'+key+'" id="f-'+key+'" type="'+(isDate?'date':isNum?'number':'text')+'" step="any" value="'+(isDate?today():key==='id'?animal:'')+'"></label>'}
function filter(){return '<div class="fields"><label class="field">시작일<input type="date" id="start" value="'+start+'"></label><label class="field">종료일<input type="date" id="end" value="'+end+'"></label></div><div class="actionrow"><button class="button secondary" id="apply">날짜 적용</button><button class="button secondary" id="csv">CSV 다운로드</button></div>'}
function tab(name,r){return '<div class="table"><table><tr>'+schema[name].map(x=>'<th>'+x[1]+'</th>').join('')+'<th>작업</th></tr>'+r.slice(-45).reverse().map(x=>{let i=data[name].indexOf(x);return '<tr>'+schema[name].map(([k])=>'<td>'+esc(x[k]??'미기록')+'</td>').join('')+'<td><button class="subbtn" data-edit="'+i+'">수정</button> <button class="subbtn" data-del="'+i+'">삭제</button></td></tr>'}).join('')+'</table></div>'}
function module(name){let perAnimal=['개체관리','급이·급수','건강·복지 관리','탄소·메탄관리','출하관리','방역·질병 이력'].includes(name),r=records(name,perAnimal?animal:null),key={'개체관리':'weight','환경관리':'temp','급이·급수':'water','건강·복지 관리':'rumination','탄소·메탄관리':'methane','출하관리':'weight'}[name];return '<h2>'+name+' <span class="badge">가상 데이터 포함</span></h2>'+(query?'<p class="result">검색된 요청: '+esc(query)+'</p>':'')+'<div class="layout"><div><div class="panel"><h3>기록 입력 / 수정</h3><form id="record" data-name="'+name+'"><div class="fields">'+schema[name].map(([k,l])=>field(k,l)).join('')+'</div><div class="actionrow"><button class="button">기록 저장</button><button class="button secondary" type="button" id="clear">초기화</button></div></form></div><div class="panel"><h3>조회 필터</h3>'+(perAnimal?'<label class="field">개체 선택<select id="animal">'+[...new Set(data['개체관리'].map(x=>x.id))].sort().map(id=>'<option '+(id===animal?'selected':'')+'>'+id+'</option>').join('')+'</select></label>':'')+filter()+'</div></div><div><div class="panel"><h3>조회 및 분석 결과</h3><div class="result">'+summary(name,r)+'</div>'+(key?graph(r,key):'')+'</div>'+(name==='환경관리'?'<div class="panel"><h3>환경 디지털트윈 · 2D 우사 현황</h3><div class="grid" style="grid-template-columns:1fr 1fr">'+['A동','B동'].map(id=>{let z=data['환경관리'].filter(x=>x.id===id).at(-1);return '<div class="card"><h3>'+id+'</h3><div class="big">'+esc(z?.temp??'미기록')+'℃</div><div class="muted">습도 '+esc(z?.humidity??'미기록')+'%<br>팬 명령 '+esc(z?.fanCmd??'미기록')+'<br>실제 상태 '+esc(z?.fanActual??'미기록')+'</div></div>'}).join('')+'</div><p class="notice">실제 장비 연결 없음. AI 알림은 관리자 점검을 보조하며, 승인 없이 제어하지 않습니다.</p><button class="button secondary" id="newTask">팬 점검 명령 생성</button></div>':'')+(name==='작업명령'?'<div class="panel"><h3>관리자 승인</h3>'+data['작업명령'].filter(x=>x.status==='승인대기').map(t=>'<p class="muted">'+esc(t.target)+' — '+esc(t.task)+' <button class="button" data-approve="'+esc(t.id)+'">승인</button> <button class="button secondary" data-hold="'+esc(t.id)+'">보류</button></p>').join('')+'</div>':'')+'<div class="panel"><h3>상세 데이터 ('+r.length+'건)</h3>'+tab(name,r)+'</div></div></div>'}
function ai(){return '<h2>AI 분석</h2><p class="muted">실제 학습 AI가 아닌 규칙 기반 초기 분석입니다. 이상 탐지 결과는 건강 진단이 아닙니다.</p><div class="panel"><label class="field">개체 선택<select id="animal">'+[...new Set(data['개체관리'].map(x=>x.id))].map(id=>'<option '+(animal===id?'selected':'')+'>'+id+'</option>').join('')+'</select></label>'+['개체관리','건강·복지 관리','탄소·메탄관리'].map(n=>'<div class="result"><b>'+n+'</b><br>'+summary(n,records(n,animal))+'</div>').join('')+'</div>'}
function report(){return '<h2>종합 관리보고서</h2><div class="panel">'+filter()+'<button class="button" id="print">PDF 인쇄·저장</button></div><div class="panel"><h3>우사 운영 현황 보고서</h3><div class="report">조회 기간: '+start+' ~ '+end+'\n생성일: '+today()+'\n\n'+Object.keys(schema).map(n=>n+': '+records(n,null).length+'건').join('\n')+'\n\n관측 사실 · 계산 결과 · 미확인 사항을 구분합니다.\n미기록을 0으로 대체하지 않습니다.\n원인이나 질병, 기계 고장을 자동 확정하지 않습니다.\n\n※ 가상 시연 자료를 포함합니다.</div></div>'}
function parse(q){query=q.trim();if(!query)return;addRecent(query);let route=[['탄소·메탄관리',/메탄|탄소|배출/],['건강·복지 관리',/반추|목걸이|활동|건강/],['환경관리',/온도|습도|THI|환기|디지털트윈|팬/],['급이·급수',/사료|급이|급수|물 사용/],['출하관리',/출하/],['보고서',/보고서|리포트/],['방역·질병 이력',/방역|질병|진료/],['설비관리',/설비|센서/],['작업명령',/작업|점검/],['개체관리',/체중|성장|개체/]].find(x=>x[1].test(query));page=route?route[0]:'AI 분석';let m=query.match(/(?:C0*)?(\d{1,3})\s*(?:번|호|번 개체)/i);if(m)animal='C'+String(+m[1]).padStart(3,'0');start=/오늘/.test(query)?today():/7일|이번 주/.test(query)?ago(6):ago(30);end=today();render();scrollTo(0,0)}
function csv(){let r=records(page,null),ks=schema[page].map(x=>x[0]),content='\ufeff'+[ks.join(','),...r.map(x=>ks.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');let url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=page+'.csv';a.click();URL.revokeObjectURL(url)}

function switchProfile(next){
 persist();profile=next;
 if(profile)localStorage.setItem('cattlecare-active-profile',profile);else localStorage.removeItem('cattlecare-active-profile');
 recentKey=scopedKey('recent');favKey=scopedKey('favorites');
 try{data=JSON.parse(localStorage.getItem(scopedKey('data')))||(!profile?JSON.parse(localStorage.getItem('cattlecare-v1')):null)||generate()}catch(e){data=generate()}
 persist();page='홈';query='';animal='C001';render();window.scrollTo(0,0)
}

 };

function showUsage(){if(document.getElementById('usageOverlay'))return;let overlay=document.createElement('div');overlay.className='usage-overlay';overlay.id='usageOverlay';overlay.innerHTML='<div class="usage-dialog" role="dialog" aria-modal="true" aria-labelledby="usageTitle"><h2 id="usageTitle">CattleCare AI 간단 사용법</h2><ol><li><strong>AI 검색:</strong> 중앙 검색창에 “오늘 1번 개체 메탄 배출량 알려줘”처럼 입력하고 Enter를 누르세요.</li><li><strong>상단 메뉴:</strong> 개체관리·환경관리·급이급수 등 상세 화면을 직접 열 수 있습니다.</li><li><strong>데이터 관리:</strong> 상세 화면에서 새 기록을 입력하고 저장·수정·삭제하세요.</li><li><strong>최근 작업:</strong> 홈 아래에서 과거 명령을 다시 실행하거나 ☆ 즐겨찾기로 저장하세요.</li><li><strong>일부 선택:</strong> 기록의 체크박스를 선택해 CSV로 다운로드하거나 삭제할 수 있습니다.</li><li><strong>보고서:</strong> 즐겨찾기 아래 “보고서 출력하기” 버튼을 누르고 기간을 설정해 PDF로 인쇄하세요.</li><li><strong>승인:</strong> 설비 점검 권고는 자동 제어가 아니며 작업명령에서 사람이 승인합니다.</li></ol><p class="muted">이 사이트는 가상 데이터 기반 교육용 시연입니다. 데이터와 검색 기록은 현재 브라우저에만 저장됩니다.</p><div class="actions"><button class="button" id="closeUsage">확인</button></div></div>';document.body.appendChild(overlay);overlay.querySelector('#closeUsage').onclick=()=>overlay.remove();overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()})}
function render(){document.getElementById('root').innerHTML='<header><div class="top"><div class="brand-side"><div class="logo" data-page="홈">▰ Cattle<span>Care</span> AI</div></div><div class="top-actions"><button type="button" id="usageOpen">ⓘ 사용법</button><button type="button" id="notificationOpen" aria-label="알림 열기">♧ 알림</button><button type="button" id="accountOpen" class="account-button">♙ 마이계정 <span class="account-name">('+esc(profile||'게스트')+')</span></button></div></div><nav>'+names.map(n=>'<button data-page="'+n+'" class="'+(page===n?'active':'')+'">'+n+'</button>').join('')+'</nav></header><main>'+(page==='홈'||page==='종합 대시보드'?home():'<div style="max-width:850px;margin:auto">'+searchBox()+'</div>'+(schema[page]?module(page):page==='AI 분석'?ai():report()))+'<div class="foot">교육용 프로토타입 · 가상 데이터 기반 · 데이터는 사용 중인 브라우저에만 저장됩니다. <button class="subbtn" id="reset">시연 데이터 초기화</button></div></main>';bind()}
function bind(){document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>{page=e.dataset.page;query='';edit=-1;render();scrollTo(0,0)});document.querySelectorAll('[data-query]').forEach(e=>e.onclick=()=>parse(e.dataset.query));document.querySelector('#ask')?.addEventListener('submit',e=>{e.preventDefault();parse(document.getElementById('q').value)});document.querySelector('#animal')?.addEventListener('change',e=>{animal=e.target.value;render()});document.querySelector('#apply')?.addEventListener('click',()=>{start=document.getElementById('start').value;end=document.getElementById('end').value;render()});document.querySelector('#csv')?.addEventListener('click',()=>{if(schema[page])csv()});document.querySelector('#print')?.addEventListener('click',()=>print());document.querySelector('#record')?.addEventListener('submit',e=>{e.preventDefault();let n=e.target.dataset.name,record=Object.fromEntries(new FormData(e.target).entries());schema[n].forEach(([k])=>{if(/weight|rumination|feeding|activity|methane|dmi|temp|humidity|feed|leftover|water|target/.test(k))record[k]=record[k]===''?null:+record[k]});if(edit>=0){data[n][edit]={...record,demo:false};edit=-1}else data[n].push({...record,demo:false});addRecent(n+' 기록 저장','입력');persist();render()});document.querySelector('#clear')?.addEventListener('click',()=>{edit=-1;render()});document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>{edit=+e.dataset.edit;let r=data[page][edit];schema[page].forEach(([k])=>{document.getElementById('f-'+k).value=r[k]??''});document.getElementById('record').scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{if(confirm('기록을 삭제할까요?')){data[page].splice(+e.dataset.del,1);persist();render()}});document.querySelector('#newTask')?.addEventListener('click',()=>{data['작업명령'].push({id:'W'+Date.now().toString().slice(-6),date:today(),target:'A동 환기팬',task:'실제 회전·통신 상태 점검',status:'승인대기'});persist();alert('점검 요청이 관리자 승인 대기에 추가되었습니다.')});document.querySelectorAll('[data-approve],[data-hold]').forEach(e=>e.onclick=()=>{let id=e.dataset.approve||e.dataset.hold,r=data['작업명령'].find(x=>x.id===id);if(r){r.status=e.dataset.approve?'승인':'보류';addRecent(r.target+' — '+r.task+' ('+r.status+')','작업')}persist();render()});document.getElementById('accountOpen')?.addEventListener('click',showAccount);document.getElementById('usageOpen')?.addEventListener('click',showUsage);document.getElementById('notificationOpen')?.addEventListener('click',()=>{page='작업명령';query='';render()});document.querySelector('#reset')?.addEventListener('click',()=>{if(confirm('모든 입력 기록을 지우고 초기화할까요?')){data=generate();persist();render()}})}
render();
</script></body></html>
